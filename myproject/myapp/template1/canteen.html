<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen</title>
</head>

<body>

    <table border="4">

        <tr>
            <th>Item ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        {% for item in Food %}

        <tr>
            <td>{{ item.item_id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.price }}</td>

            <td>
                {% if item.available == "Yes" %}
                    Yes
                {% else %}
                    No
                {% endif %}
            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
